<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ViraCheck — Yasal / Legal</title>
<style>
  :root{
    --bg:#ffffff; --fg:#12202e; --muted:#5a6b7c; --line:#e3e9ef;
    --accent:#0f9c92; --card:#f6f9fb;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0A1420; --fg:#e8eef4; --muted:#93a4b5; --line:#1e2c3b;
           --accent:#2ED3C6; --card:#101d2b; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100vh;
  }
  .wrap{max-width:520px; width:100%; padding:40px 22px}
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:18px}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);flex:none}
  .brand span{font-weight:700; letter-spacing:.02em}
  h1{font-size:1.5rem; margin:0 0 6px}
  p.sub{color:var(--muted); margin:0 0 28px}
  a.item{
    display:block; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:16px 18px; margin-bottom:12px;
    text-decoration:none; color:var(--fg);
  }
  a.item:hover{border-color:var(--accent)}
  a.item strong{display:block; color:var(--accent); margin-bottom:2px}
  a.item span{color:var(--muted); font-size:.9rem}
  footer{margin-top:28px; color:var(--muted); font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span><span>ViraCheck</span></div>
  <h1>Yasal belgeler / Legal</h1>
  <p class="sub">Denize açılmadan önce kontrol · Pre-departure checks</p>

  <a class="item" href="privacy-tr.html">
    <strong>Gizlilik Politikası</strong>
    <span>Türkçe</span>
  </a>
  <a class="item" href="privacy-en.html">
    <strong>Privacy Policy</strong>
    <span>English</span>
  </a>

  <footer>ViraCheck · Ege Seymen · <a href="mailto:egeseymen@icloud.com" style="color:var(--accent)">egeseymen@icloud.com</a></footer>
</div>
</body>
</html>
